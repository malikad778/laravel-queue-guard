name: 'Laravel Queue Guard'
description: 'Static analysis for Laravel queues, Horizon, and FinTech concurrency bugs'
author: 'Adnan Malik'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  paths:
    description: 'Directories or files to analyse'
    required: false
    default: 'app'
  config:
    description: 'Path to configuration file'
    required: false
    default: 'config/queue-guard.php'
  format:
    description: 'Output format (console, json, sarif, github, checkstyle, junit, gitlab)'
    required: false
    default: 'github'
  fail-on:
    description: 'Minimum severity to fail the action (error, warning, info)'
    required: false
    default: 'error'
  baseline:
    description: 'Path to baseline file'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Run Queue Guard
      shell: bash
      run: |
        ARGS="analyse ${{ inputs.paths }} --format=${{ inputs.format }} --fail-on=${{ inputs.fail-on }}"
        if [ -n "${{ inputs.config }}" ] && [ -f "${{ inputs.config }}" ]; then
          ARGS="$ARGS --config=${{ inputs.config }}"
        fi
        if [ -n "${{ inputs.baseline }}" ] && [ -f "${{ inputs.baseline }}" ]; then
          ARGS="$ARGS --baseline=${{ inputs.baseline }}"
        fi
        php vendor/bin/queue-guard $ARGS
